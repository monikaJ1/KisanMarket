<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Kisan Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-eyebrow">Join the Marketplace</div>
    <h2>Create your account</h2>
    <p class="auth-sub">Register as a farmer, consumer, or delivery agent.</p>

    <div id="alertBox"></div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label">I want to register as a...</label>
        <div class="role-select">
          <label class="role-option active">
            <input type="radio" name="role" value="consumer" checked>
            🛒<br>Consumer
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="farmer">
            🌾<br>Farmer
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="delivery">
            🚚<br>Delivery
          </label>
        </div>
        <div class="input-hint">Admin accounts are created internally and cannot be self-registered.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="e.g. Ramesh Gowda" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>

      <div class="form-group" id="villageGroup" style="display:none;">
        <label class="form-label" for="village">Village / Town</label>
        <input type="text" id="village" class="form-control" placeholder="e.g. Mandya">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <div class="auth-foot">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>
</div>

<footer class="footer" id="footer"></footer>

<script src="js/app.js"></script>
<script>
  document.querySelectorAll('.role-option').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      const role = opt.querySelector('input').value;
      document.getElementById('villageGroup').style.display = (role === 'farmer') ? 'block' : 'none';
    });
  });

  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const role = document.querySelector('input[name="role"]:checked').value;
    const village = document.getElementById('village').value.trim();

    if (password !== confirmPassword) {
      alertBox.innerHTML = `<div class="alert alert-error">Passwords do not match.</div>`;
      return;
    }

    const result = KM.register({ name, email, password, role, village });

    if (result.success) {
      alertBox.innerHTML = `<div class="alert alert-success">Account created successfully! Redirecting to login...</div>`;
      setTimeout(() => window.location.href = 'login.html', 1200);
    } else {
      alertBox.innerHTML = `<div class="alert alert-error">${result.message}</div>`;
    }
  });

  KM.renderNavbar('register');
  KM.renderFooter();
</script>

</body>
</html>
